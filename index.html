        try { if (s.open) dc.send(JSON.stringify({_fff: 'ping', ts: Date.now()})); } catch (e) { /* ignorat */ }
        const idle = Date.now() - lastSeen;
        if (idle > hb.timeout && state === 'open') { lostSince = Date.now(); set('lost'); emit('lost'); }
        else if (state === 'lost' && Date.now() - lostSince > hb.giveUp) finish('timeout');
      }, hb.interval);
    }
    s._bind = function (ch) {
      dc = ch;
      let opened = false; const early = [];
      // «open» se emite o singură dată (la oaspete, canalul vine deja deschis și browserul trimite apoi încă un eveniment «open»), iar mesajele sosite ÎNAINTEA lui
      // (Chrome le poate livra primele) se rețin și se dau după ce ascultătorii lui «open» s-au înregistrat; altfel primul mesaj al celuilalt capăt s-ar pierde.
      ch.onopen = () => {
        if (opened) return; opened = true;
        clearTimeout(connTimer); set('open'); startHb();
        if (role === 'host') { try { ch.send('{"_fff":"ready"}'); } catch (e) { /* ignorat */ } }   // gazda are canalul deschis: oaspetele își poate trimite coada
        else readyT = setTimeout(flush, READY_MS);
        emit('open', s);
        early.splice(0).forEach(o => emit('message', o));
      };
      ch.onmessage = e => {
        if (typeof e.data !== 'string' || e.data.length > MAX_MSG) return;
        let o; try { o = JSON.parse(e.data); } catch (er) { return; }
        if (!o || typeof o !== 'object' || Array.isArray(o)) return;
        lastSeen = Date.now(); received++; flush();
        if (state === 'lost') { set('open'); emit('recovered'); }
        if (o._fff) return internal(o);
        if (!opened) { if (early.length < 64) early.push(o); return; }
        emit('message', o);
      };
      ch.onclose = () => { if (!closed) finish('channel-closed'); };
      ch.onerror = () => { /* detaliile vin prin starea conexiunii */ };
      if (ch.readyState === 'open') ch.onopen();
    };

      clearTimeout(connTimer);
      connTimer = setTimeout(() => { if (!closed && state !== 'open') { emit('error', coded('timeout', 'failed')); finish('timeout'); } }, hb.connect);
    };
    pc.onconnectionstatechange = () => {
      const c = pc.connectionState;
      if (c === 'failed') { emit('error', coded('ice-failed', 'failed')); finish('failed'); }
      else if (c === 'disconnected' && state === 'open') { lostSince = Date.now(); set('lost'); emit('lost'); }
      else if (c === 'connected' && state === 'lost') { set('open'); emit('recovered'); }

    if (role === 'guest') pc.ondatachannel = e => { if (!dc && e.channel.label === 'fff') s._bind(e.channel); };

  }

  async function prepare(opts) {
    if (!supported()) throw coded('unsupported', 'unsupported');
    return new RTCPeerConnection(rtcConfig(opts));
  }
  async function gather(pc, opts, gp) {
    await gp;
    const sdp = pc.localDescription && pc.localDescription.sdp;
    if (!sdp || !/^a=candidate:/m.test(sdp)) throw coded('no-candidates', 'noCandidates');
    return sdp;
  }

  /** Gazdă: returnează o sesiune cu .offer (cod text); apoi accept(răspuns). */
  async function host(opts) {
    opts = opts || {};
    const pc = await prepare(opts), s = createSession('host', pc, opts);
    try {
      s._bind(pc.createDataChannel('fff', {ordered: true}));
      s._setState('gathering');
      const gp = watchGathering(pc, opts);
      await pc.setLocalDescription(await pc.createOffer());
      s.offer = await encodeSignal('offer', await gather(pc, opts, gp), opts);
    } catch (e) { try { pc.close(); } catch (er) { /* ignorat */ } throw e; }
    s._setState('waiting-answer');
    s.accept = async function (code) {
      const r = await decodeSignal(code);
      if (r.kind !== 'answer') throw coded('wrong-kind', 'wrongKind', {want: T('kindAnswer'), got: T('kindOffer')});
      await pc.setRemoteDescription({type: 'answer', sdp: r.sdp});
      s._setState('connecting'); s._armConnect();
    };
    return s;
  }
  /** Oaspete: primește oferta (cod) și returnează o sesiune cu .answer (cod text). */
  async function join(offerCode, opts) {
    opts = opts || {};
    if (!supported()) throw coded('unsupported', 'unsupported');
    const r = await decodeSignal(offerCode);
    if (r.kind !== 'offer') throw coded('wrong-kind', 'wrongKind', {want: T('kindOffer'), got: T('kindAnswer')});
    const pc = await prepare(opts), s = createSession('guest', pc, opts);
    try {
      s._setState('gathering');
      await pc.setRemoteDescription({type: 'offer', sdp: r.sdp});
      const gp = watchGathering(pc, opts);
      await pc.setLocalDescription(await pc.createAnswer());
      s.answer = await encodeSignal('answer', await gather(pc, opts, gp), opts);
    } catch (e) { try { pc.close(); } catch (er) { /* ignorat */ } throw e; }
    s._setState('connecting'); s._armConnect();
    return s;
  }

  /* ======================= sesiune de joc: lockstep cu gazdă autoritară ======================= */
  function mulberry(seed) {
    let a = seed >>> 0;
    const f = () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    f.getState = () => a; f.setState = v => { a = v >>> 0; };
    return f;
  }
  function randSeed() { try { return crypto.getRandomValues(new Uint32Array(1))[0]; } catch (e) { return (Math.random() * 4294967296) >>> 0; } }

  /**
   * lockstep(session, {seed, onMove(move,info), onState(state,info), validate(move,ctx), snapshot(), hash(), onChat(text,from), onError(err), timeout, history})
   * Gazda atribuie seq, validează și difuzează; oaspetele aplică mutările doar în ordinea seq (resincronizare la lipsuri/divergență).
   */
  function lockstep(session, o) {
    o = o || {};
    let sess = session, seq = 0, seed = o.seed != null ? o.seed >>> 0 : randSeed(), rng = mulberry(seed), started = false, stopped = false, cid = 0, helloTries = 0, helloTimer = 0;
    const isHost = () => sess.role === 'host', log = [], ahead = new Map(), pending = new Map(), offs = [];
    const AHEAD_MAX = 256;
    const keep = o.history || 500, stats = {resyncs: 0, rejected: 0, dupes: 0, applied: 0};
    const fail = (reason, extra) => { const e = Object.assign(new Error(reason), {code: reason}, extra || {}); if (o.onError) o.onError(e); return e; };
    const send = m => sess.send(m);
    const tryApply = (move, info) => {
      let r;
      try { r = o.onMove ? o.onMove(move, info) : undefined; } catch (e) { return {ok: false, reason: String(e && e.message || e)}; }
      if (r === false) return {ok: false, reason: 'rejected'};
      if (typeof r === 'string') return {ok: false, reason: r};
      return {ok: true};
    };
    function snapshotMsg() {
      const m = {t: 'sync', seq, seed, rng: rng.getState()};
      if (o.snapshot) m.state = o.snapshot();
      return m;
    }
    function begin(reason, st) {
      if (!started) { started = true; clearTimeout(helloTimer); }
      if (o.onState) o.onState(st, {reason, seq, seed, rng: rng.getState()});
    }
    function applyRemote(m) {                                  // oaspete: o mutare numerotată de la gazdă
      if (m.seq <= seq) { stats.dupes++; return; }
      if (m.seq > seq + 1) {
        if (m.seq - seq > AHEAD_MAX || ahead.size >= AHEAD_MAX) { send({t: 'need', from: seq}); return; }   // plafon: un partener rău nu umple memoria
        ahead.set(m.seq, m); send({t: 'need', from: seq}); return;
      }
      const mine = m.from === 'guest' && pending.has(m.cid);
      const r = tryApply(m.move, {seq: m.seq, from: m.from, mine, rng});
      if (!r.ok) { fail('diverged', {detail: r.reason}); stats.resyncs++; send({t: 'need', from: seq, force: true}); return; }
      seq = m.seq; stats.applied++;
      if (mine) { const p = pending.get(m.cid); pending.delete(m.cid); clearTimeout(p.timer); p.resolve({seq, ok: true}); }
      if (o.hash && m.h != null && String(o.hash()) !== String(m.h)) { stats.resyncs++; send({t: 'need', from: seq, force: true}); return; }
      const nx = ahead.get(seq + 1); if (nx) { ahead.delete(seq + 1); applyRemote(nx); }
    }
    function hostApply(move, from, cidv) {                     // gazdă: validează, aplică, numerotează, difuzează
      if (move == null || typeof move !== 'object') return {ok: false, reason: 'bad-move'};
      if (o.validate) { const v = o.validate(move, {from, seq: seq + 1}); if (v !== true && v !== undefined) return {ok: false, reason: typeof v === 'string' ? v : 'invalid'}; }
      const r = tryApply(move, {seq: seq + 1, from, mine: from === 'host', rng});
      if (!r.ok) return r;
      seq++; stats.applied++;
      log.push({seq, move, from}); if (log.length > keep) log.shift();
      const m = {t: 'move', seq, move, from}; if (cidv != null) m.cid = cidv; if (o.hash) m.h = o.hash();
      send(m);
      return {ok: true, seq};
    }
    function onMsg(m) {
      if (stopped || !m || typeof m.t !== 'string') return;
      if (isHost()) {
        if (m.t === 'hello') { send(snapshotMsg()); }
        else if (m.t === 'move') {
          const r = hostApply(m.move, 'guest', m.cid);
          if (!r.ok) { stats.rejected++; send({t: 'reject', cid: m.cid, reason: r.reason}); }
        } else if (m.t === 'need') {
          const from = Number.isInteger(m.from) ? m.from : -1;
          if (!m.force && log.length && log[0].seq <= from + 1 && from <= seq) send({t: 'moves', list: log.filter(e => e.seq > from)});
          else if (o.snapshot) { stats.resyncs++; send(Object.assign(snapshotMsg(), {resync: true})); }
          else send({t: 'fatal', reason: 'no-history'});
        } else if (m.t === 'chat' && o.onChat && typeof m.text === 'string') o.onChat(m.text.slice(0, 2000), 'guest');
        return;
      }
      if (m.t === 'sync') {                                    // oaspete
        if (!Number.isInteger(m.seq) || !Number.isInteger(m.seed) || m.seq < 0) return;
        if (!m.resync && started && m.seq === seq && m.seed === seed) return;     // idempotent
        if (m.state !== undefined || m.seq === 0) {            // stare completă sau început de joc
          const first = !started;
          seq = m.seq; seed = m.seed >>> 0; rng = mulberry(seed);
          if (Number.isInteger(m.rng)) rng.setState(m.rng);
          ahead.clear(); begin(first ? 'start' : 'resync', m.state);
        } else if (m.seq > seq) {                              // gazda e înainte, fără instantaneu: cere mutările
          if (!started) { seed = m.seed >>> 0; rng = mulberry(seed); started = true; clearTimeout(helloTimer); }
          send({t: 'need', from: seq});
        } else fail('diverged');
      } else if (m.t === 'move') { if (started && Number.isInteger(m.seq) && m.move && typeof m.move === 'object') applyRemote(m); }
      else if (m.t === 'moves' && Array.isArray(m.list)) { m.list.slice(0, keep).forEach(e => { if (e && Number.isInteger(e.seq) && e.move && typeof e.move === 'object') applyRemote({t: 'move', seq: e.seq, move: e.move, from: e.from === 'host' ? 'host' : 'guest'}); }); }
      else if (m.t === 'reject') { const p = pending.get(m.cid); if (p) { pending.delete(m.cid); clearTimeout(p.timer); p.reject(Object.assign(new Error(String(m.reason || 'rejected')), {code: 'rejected'})); } }
      else if (m.t === 'fatal') fail(String(m.reason || 'fatal'));
      else if (m.t === 'chat' && o.onChat && typeof m.text === 'string') o.onChat(m.text.slice(0, 2000), 'host');
    }
    function bind() {
      offs.forEach(f => f()); offs.length = 0;
      offs.push(sess.on('message', onMsg));
      offs.push(sess.on('open', start));
      offs.push(sess.on('close', () => { pending.forEach(p => { clearTimeout(p.timer); p.reject(Object.assign(new Error('closed'), {code: 'closed'})); }); pending.clear(); }));
      if (sess.open) start();
    }
    function start() {
      if (isHost()) { if (!started) { started = true; begin('start'); } send(snapshotMsg()); }
      else { helloTries = 0; hello(); }
    }
    function hello() {
      clearTimeout(helloTimer);
      if (stopped) return;
      if (helloTries++ >= 8) { if (!started) fail('no-sync'); return; }
      send({t: 'hello', seq});
      helloTimer = setTimeout(() => { if (!started) hello(); }, 1500);
    }
    const api = {
      get seq() { return seq; }, get seed() { return seed; }, get role() { return sess.role; }, get stats() { return Object.assign({}, stats); },
      rng: () => rng(), get rngState() { return rng.getState(); },
      /** Trimite o mutare. Gazdă: aplică imediat; oaspete: așteaptă ecoul numerotat al gazdei. Returnează Promise<{seq}>. */
      move(move) {
        if (stopped) return Promise.reject(Object.assign(new Error('stopped'), {code: 'stopped'}));
        if (isHost()) {
          const r = hostApply(move, 'host');
          return r.ok ? Promise.resolve({seq: r.seq, ok: true}) : Promise.reject(Object.assign(new Error(r.reason), {code: 'rejected'}));
        }
        if (!sess.open) return Promise.reject(Object.assign(new Error('closed'), {code: 'closed'}));
        const id = ++cid;
        return new Promise((resolve, reject) => {
          const timer = setTimeout(() => { pending.delete(id); reject(Object.assign(new Error('timeout'), {code: 'timeout'})); }, o.timeout || 8000);
          pending.set(id, {resolve, reject, timer});
          if (!send({t: 'move', cid: id, move})) { clearTimeout(timer); pending.delete(id); reject(Object.assign(new Error('closed'), {code: 'closed'})); }
        });
      },
      chat(text) { return send({t: 'chat', text: String(text).slice(0, 2000)}); },
      /** Cere resincronizarea completă (oaspete) sau retrimite starea (gazdă). */
      resync() { if (isHost()) return send(snapshotMsg()); return send({t: 'need', from: seq, force: true}); },
      /** După o reconectare: leagă aceeași stare de joc la o sesiune nouă. */
      rebind(newSession) { sess = newSession; bind(); },
      stop() { stopped = true; clearTimeout(helloTimer); offs.forEach(f => f()); offs.length = 0; }
    };
    bind();
    return api;
  }

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='hsl(250%2070%25 30%25)'/%3E%3Ctext x='32' y='45' text-anchor='middle' font-family='sans-serif' font-weight='800' font-size='38' fill='white'%3EP%3C/text%3E%3C/svg%3E">
<style>:root{--h:250;color-scheme:dark;
--bg:#0b1020;--bg2:#121a33;--card:#141c38;--card2:#1a2447;--line:#2a3560;--tx:#eaf0ff;--mut:#b4bfdf;
--ac:hsl(var(--h) 85% 72%);--ac2:hsl(calc(var(--h) + 50) 85% 72%);--btn:hsl(var(--h) 70% 30%);--btntx:#fff;--link:hsl(var(--h) 90% 76%);--code:#0a0f20;--glow:hsl(var(--h) 85% 55% / .35)}
:root[data-theme="light"]{color-scheme:light;--bg:#f6f8ff;--bg2:#eaefff;--card:#fff;--card2:#f0f3ff;--line:#cfd7f2;--tx:#10162e;--mut:#4a5578;
--ac:hsl(var(--h) 80% 24%);--ac2:hsl(calc(var(--h) + 50) 80% 26%);--btn:hsl(var(--h) 70% 30%);--link:hsl(var(--h) 80% 26%);--code:#eef2ff;--glow:hsl(var(--h) 85% 60% / .28)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){color-scheme:light;--bg:#f6f8ff;--bg2:#eaefff;--card:#fff;--card2:#f0f3ff;--line:#cfd7f2;--tx:#10162e;--mut:#4a5578;
--ac:hsl(var(--h) 80% 24%);--ac2:hsl(calc(var(--h) + 50) 80% 26%);--link:hsl(var(--h) 80% 26%);--code:#eef2ff;--glow:hsl(var(--h) 85% 60% / .28)}}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:72px}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-x:hidden;
background-image:radial-gradient(900px 500px at 85% -5%,var(--glow),transparent 60%),radial-gradient(700px 420px at -5% 40%,hsl(calc(var(--h) + 60) 80% 50% / .14),transparent 60%);background-repeat:no-repeat}
a{color:var(--link)}a:focus-visible,button:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.skip{position:absolute;left:-999px;top:8px;background:var(--btn);color:var(--btntx);padding:8px 14px;border-radius:8px;z-index:50}.skip:focus{left:8px}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:10px 16px;backdrop-filter:blur(14px);background:color-mix(in srgb,var(--bg) 78%,transparent);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;letter-spacing:.02em;color:var(--tx);text-decoration:none;font-size:1.05rem;min-width:0}
.brand span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.logo{width:22px;height:22px;border-radius:7px;background:conic-gradient(from 210deg,var(--ac),var(--ac2),var(--ac));flex:none;box-shadow:0 0 18px var(--glow)}
#nav{display:flex;gap:2px;margin-left:auto;flex-wrap:wrap}
#nav a{color:var(--mut);text-decoration:none;padding:6px 11px;border-radius:999px;font-size:.92rem}
#nav a:hover{background:var(--card2);color:var(--tx)}
.tools{display:flex;gap:8px;align-items:center}
.sel,.ibtn{background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:10px;font:inherit;font-size:.9rem;min-height:36px}
.sel{padding:4px 8px;max-width:128px}.ibtn{width:38px;display:grid;place-items:center;cursor:pointer}
.ibtn:hover,.sel:hover{border-color:var(--ac)}
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:24px;align-items:center;max-width:1120px;margin:0 auto;padding:56px 20px 36px;position:relative}
.badge{display:inline-flex;align-items:center;gap:8px;margin:0 0 14px;padding:6px 13px;border:1px solid var(--line);border-radius:999px;background:var(--card);font-size:.85rem;color:var(--mut)}
.badge::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ac);box-shadow:0 0 0 0 var(--glow);animation:ping 2.2s infinite}
h1{margin:0;font-size:clamp(2.4rem,7vw,4.6rem);line-height:1.02;letter-spacing:-.02em;font-weight:850;overflow-wrap:anywhere;
background:linear-gradient(100deg,var(--tx) 10%,var(--ac) 55%,var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}
.tagline{font-size:clamp(1.05rem,2.4vw,1.35rem);color:var(--mut);margin:16px 0 22px;max-width:36em}
.cta{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:22px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 20px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--tx);text-decoration:none;font-weight:650;cursor:pointer;font-size:1rem;font-family:inherit;transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 26px var(--glow)}
.btn.pri{background:var(--btn);color:var(--btntx);border-color:transparent}
.chips{display:flex;flex-wrap:wrap;gap:10px;list-style:none;margin:0;padding:0}
.chips li{padding:8px 14px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-size:.88rem;color:var(--mut)}
.chips b{display:block;color:var(--tx);font-size:1.08rem;line-height:1.25}
.art{position:relative;aspect-ratio:1;max-width:440px;width:100%;margin:0 auto;color:var(--ac)}
.art svg{position:relative;width:100%;height:100%;filter:drop-shadow(0 12px 40px var(--glow))}
.halo{position:absolute;inset:6%;border-radius:50%;background:radial-gradient(circle,var(--glow),transparent 68%);animation:breathe 6s ease-in-out infinite}
.pulse{animation:pulse 2.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.bar{transform-box:fill-box;transform-origin:50% 100%;animation:bar 2.4s ease-in-out infinite}
.rock{transform-box:fill-box;transform-origin:50% 0;animation:rock 5s ease-in-out infinite}
.spin{transform-box:view-box;transform-origin:200px 200px;animation:spin 60s linear infinite}.spin2{transform-box:view-box;transform-origin:200px 200px;animation:spin 24s linear infinite reverse}

<style id="app-style">/* PROIECTOR FĂRĂ FRONTIERE · stiluri: cardul din pagină (alegerea rolului) și stratul sesiunii. CSS conservator pentru browsere mai vechi:

/* ---- cardul din pagină ---- */
.pf-roles { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); grid-gap: 16px; gap: 16px; margin: 12px 0 18px; }

.pf-looks { display: flex; flex-wrap: wrap; margin: 4px 0 12px; }

.pf-chk input { width: 22px; height: 22px; margin: 0; }
.pf-know { margin: .4em 0 0; padding-left: 1.2em; max-width: 68ch; }

.pf-danger { border-color: #d55e00; border-width: 2px; }

.pf-lookrow > * { margin: 3px 6px 3px 0; }

.pf-banner { flex: 0 0 auto; margin: 0; padding: 10px 14px; background: #6a2fb0; color: #fff; font-weight: 700; text-align: center; }
.pf-toast { position: absolute; left: 12px; right: 12px; bottom: 12px; text-align: center; pointer-events: none; }

.pf-toast { padding: 8px 14px; border: 1px solid var(--ac); border-radius: 10px; background: var(--card); color: var(--tx); font-weight: 650; }

  .pf-side { flex: 0 0 auto; max-width: none; max-height: 45%; border-right: 0; border-bottom: 1px solid var(--line); }
  .pf-acts-bar > * { margin-left: 0; margin-right: 8px; }
}
/* ---- contrast ridicat și text mare (alegeri ale utilizatorului, valabile în strat și în widget) ---- */
.pf-live.pf-hc { --bg: #000; --bg2: #000; --card: #000; --card2: #000; --line: #fff; --tx: #fff; --mut: #fff; --ac: #ffd54a; --btn: #ffd54a; --btntx: #000; }
.pf-hc .pf-btn, .pf-hc .pf-sel, .pf-hc .pf-look > summary, .pf-hc .pf-act, .pf-hc .pf-peer { border-width: 2px; border-color: #fff; }
.pf-hc .pf-btn[aria-pressed="true"], .pf-hc .pf-btn[aria-expanded="true"], .pf-hc .pf-pri { border-color: #ffd54a; }

.pf-live.pf-xl { font-size: 1.35rem; }
.pf-xl .pf-btn, .pf-xl .pf-sel, .pf-xl .pf-look > summary { min-height: 56px; }

@media print { .pf-live { display: none !important; } }
</style>
<style id="w-css" media="not all" data-sha256="KrrL6DBGOQZKz2Wj69wpWDsywa/PJ8zDu3BQoXklodM=">/* PROIECTOR FĂRĂ FRONTIERE · sandbox.css — stilul comun al widgeturilor (se aplică DOAR în iframe-ul izolat; în pagina-gazdă blocul este inert: media="not all").

.qz-board li::before { content: counter(qz) "."; width: 2em; font-weight: 800; }

.qz-chk input { width: 22px; height: 22px; min-height: 0; margin: 0 8px 0 0; }

.tm-wrap { align-items: center; justify-content: center; flex: 1 1 auto; text-align: center; }
.tm-time { font-size: 20vw; line-height: 1; }
@media (orientation: landscape) { .tm-time { font-size: 26vh; } }
.tm-meter { width: 80%; max-width: 900px; height: 16px; border: 2px solid var(--bd); border-radius: 9px; overflow: hidden; margin: 14px 0 6px; }
.tm-fill { height: 100%; width: 100%; background: var(--acc); }
.tm-msg { min-height: 1.5em; font-size: calc(1.6rem * var(--fs)); margin: 4px 0; }
.is-done .tm-time { color: var(--bad); animation: tm-flash 1s 3; }
@keyframes tm-flash { 50% { opacity: .3; } }
.tm-ctl { margin-top: 10px; }
.tm-only { text-align: center; }
.tm-ctl input { width: 6em; }
/* whiteboard */
.wb-bar { align-items: center; }
.wb-wrap { border: 2px solid var(--bd); border-radius: 8px; background: #ffffff; overflow: hidden; }
.wb-cv { display: block; width: 100%; height: auto; touch-action: none; cursor: crosshair; background: #ffffff; }
.wb-leg { list-style: none; margin: 0 0 10px; padding: 0; display: flex; flex-wrap: wrap; }
.wb-leg li { margin: 0 14px 6px 0; }
.wb-host { background: #111111; }

ivo muestra la pantalla compartida y dirige las actividades. Los teléfonos se añaden de uno en uno.","role_guest":"Soy un teléfono","role_guest_d":"Únete al proyector de tu docente y participa en la actividad.","lbl_name":"Tu nombre (lo ven los demás)","name_hint":"Hasta 24 caracteres. Se queda en tu dispositivo y en las pantallas conectadas.","start_host":"Iniciar una sesión","start_guest":"Unirse a una sesión","h_look":"Visualización","hc":"Alto contraste","xl":"Texto grande","theme":"Claro / oscuro","h_know":"Conviene saber","k1":"El emparejamiento no necesita servidor: cada teléfono se empareja con el proyector intercambiando un código (QR o texto). El emparejamiento muestra la dirección IP de cada dispositivo al otro; el diálogo pide antes tu consentimiento.","k2":"Funciona en la misma red Wi-Fi/local. Las redes de invitados que aíslan los dispositivos y algunas redes móviles lo bloquean. Sin servidor STUN nada sale de la red local.","k3":"Si un teléfono pierde la conexión (pantalla apagada, cambio de Wi-Fi), añádelo de nuevo: conserva su nombre y color. Pide que mantengan la pantalla encendida.","k4":"Las actividades se ejecutan en un marco aislado, sin red, sin almacenamiento y sin acceso a esta página; solo se conceden los permisos que se muestran en cada actividad.","no_rtc":"Este navegador no puede hacer conexiones directas (WebRTC). Aun así puedes usar las actividades solo en este dispositivo.","live_label":"Vista de la sesión","b_host":"Proyector","b_guest":"Teléfono","peers_n":"Teléfonos conectados: {0}","st_wait":"Esperando teléfonos…","st_conn":"Conectado al proyector","st_lost":"Conexión perdida. Vuelve, comprueba que estás en la misma red Wi-Fi y únete de nuevo.","st_weak":"Sin señal desde hace unos segundos…","add_phone":"Añadir un teléfono","lock_all":"Bloquear todos los teléfonos","unlock_all":"Desbloquear todos los teléfonos","fs":"Pantalla completa","fs_exit":"Salir de pantalla completa","lang_lbl":"Idioma","end":"Terminar la sesión","end_sure"
